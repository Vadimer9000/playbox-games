name: Build PlayBox Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

jobs:
  build:
    name: Build APKs with Gradle 8.9
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Signing Keystore
        run: |
          mkdir -p "$GITHUB_WORKSPACE/keystore"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/keystore/release.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/keystore/release.jks" \
              -alias playbox \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=PlayBox, OU=Mobile, O=PlayBox, L=SPb, S=SPb, C=RU"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=playbox" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Send APK to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 | sed 's/[_*`\[\]]/ /g')
            BUILD_DATE=$(date +'%Y-%m-%d')
            SHORT_SHA=$(git rev-parse --short HEAD)
            TARGET_APK="PlayBox-release_${BUILD_DATE}_${SHORT_SHA}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$TARGET_APK"
            CAPTION="🎮 *Готова сборка PlayBox (54 игры)!*%0A%0A💬 _${COMMIT_MSG}_%0A⏰ $(date +'%d.%m.%Y %H:%M:%S UTC')%0A%0A#playbox"
            RESP=$(curl -s --ipv4 --retry 5 --retry-delay 3 --retry-all-errors \
                 -F chat_id="${TELEGRAM_CHAT_ID}" \
                 -F "document=@${TARGET_APK};type=application/vnd.android.package-archive" \
                 -F caption="${CAPTION}" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
            echo "Telegram response: $RESP"
            if echo "$RESP" | grep -q '"ok":false'; then
              curl -s --ipv4 --retry 5 --retry-delay 3 \
                   -F chat_id="${TELEGRAM_CHAT_ID}" \
                   -F "document=@${TARGET_APK};type=application/vnd.android.package-archive" \
                   -F caption="🎮 Готова сборка PlayBox (54 игры)! ${BUILD_DATE} #playbox" \
                   "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
            fi
          else
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not configured in repository secrets."
          fi
